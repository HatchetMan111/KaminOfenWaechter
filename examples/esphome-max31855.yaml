# Beispiel: ESP32 + MAX31855 + Typ-K-Thermoelement
#
# 1. In ESPHome als neues Gerät anlegen (oder diese Datei als YAML einfügen).
# 2. Secrets für WLAN/API/OTA anpassen.
# 3. Flashen, Sensor in Home Assistant prüfen.
# 4. In FlueGuard als Quelle auswählen.

esphome:
  name: kamin-rauchgas
  friendly_name: Kamin Rauchgas

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: INFO
  logs:
    max31855: WARN

# API-Schlüssel: in ESPHome generieren lassen
api:
  encryption:
    key: "BITTE-ERSETZEN-32-BYTE-BASE64-KEY"

ota:
  - platform: esphome
    password: "BITTE-ERSETZEN"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Kamin-Rauchgas Fallback"
    password: "BITTE-ERSETZEN"

captive_portal:

# MAX31855 hängt am SPI-Bus, CS separat.
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

sensor:
  - platform: max31855
    name: "Rauchgas Temperatur"
    cs_pin: GPIO5
    update_interval: 5s
    # Median gegen einzelne Ausreißer, Clamp gegen Unsinnswerte.
    filters:
      - median:
          window_size: 5
          send_every: 5
      - clamp:
          min_value: -20
          max_value: 900
      # Optional: Kalibrier-Offset in Kelvin, z. B. wenn der Fühler
      # systematisch 3 K zu niedrig zeigt.
      # - offset: 3.0

  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"

button:
  - platform: restart
    name: "Neustart"
